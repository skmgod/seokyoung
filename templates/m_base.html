<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffdf3e">
<title>{% block title %}관리 스케줄{% endblock %}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='mobile.css') }}">
</head>
<body class="m">
{% macro csrf() %}<input type="hidden" name="csrf" value="{{ csrf_token }}">{% endmacro %}
<div class="m-app">
  {% for cat, msg in get_flashed_messages(with_categories=true) %}<div class="m-flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% block content %}{% endblock %}
</div>
{% set ep = request.endpoint %}
<nav class="m-tab">
  <a href="{{ url_for('schedule.home') }}" class="{{ 'on' if ep == 'schedule.home' }}">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5 2.8 9.2c-.5.4-.8 1-.8 1.6V20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-9.2c0-.6-.3-1.2-.8-1.6z"/><path d="M8 14.5c1 1.6 2.4 2.4 4 2.4s3-.8 4-2.4" stroke="#fff" stroke-width="1.9" fill="none" stroke-linecap="round"/></svg>홈</a>
  <a href="{{ url_for('schedule.cal') }}" class="{{ 'on' if ep == 'schedule.cal' }}">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h2v3H7zM15 2h2v3h-2z"/><rect x="3" y="4" width="18" height="18" rx="3"/><path d="m12 9.3 1.2 2.5 2.7.4-2 1.9.5 2.7-2.4-1.3-2.4 1.3.5-2.7-2-1.9 2.7-.4z" fill="#fff"/></svg>달력</a>
  <a href="{{ url_for('schedule.edit', back=request.full_path) }}" class="center {{ 'on' if ep == 'schedule.edit' }}">
    <span class="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
    <span class="lbl">일정추가</span></a>
  <a href="{{ url_for('schedule.all_list') }}" class="{{ 'on' if ep == 'schedule.all_list' }}">
    <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9h8M8 12.5h8M8 16h5" stroke="#fff" stroke-width="1.9" stroke-linecap="round"/></svg>전체일정</a>
  <a href="{{ url_for('dashboard') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>관리메뉴</a>
</nav>
</body>
</html>
