{% extends "base.html" %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<h1>비밀번호 변경</h1>
<form method="post" class="panel" style="max-width:380px">
  {{ csrf() }}
  <div class="grid" style="grid-template-columns:1fr">
    <label>현재 비밀번호<input type="password" name="current" required></label>
    <label>새 비밀번호 (6자 이상)<input type="password" name="password" required minlength="6"></label>
    <label>새 비밀번호 확인<input type="password" name="password2" required minlength="6"></label>
  </div>
  <p><button>변경</button></p>
</form>
{% endblock %}
